<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+"
        crossorigin="anonymous"></script>


    <style>
        * {
            margin: 0;
            padding: 0;
            /* box-sizing: border-box; */
        }

        .nav {
            background-color: black;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            height: 100px;
        }

        .siva {
            display: flex;
            gap: 30px;
        }

        .siva a {
            text-decoration: none;
            color: white;
        }

        .container-fluid {
            background: linear-gradient();
        }

        /* name */
        .name {
            background: linear-gradient(to left, blue, purple);
            width: 100%;
            height: 600px;
            color: white;
            text-align: center;
            /* margin-top: 150px; */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

        }
        .mm{
           animation: move 4s ; 
        }
        @keyframes move{
            from{
                transform: translateX(-500px);
                color: aquamarine;

            }
            to{
                transform: translateX(0px);
            }
        }
        
    </style>
</head>

<body>
    <!-- navigation -->
    <div class="container-fluid">
        <div class="nav">
            <h2>SIVARAMAN S</h2>

            <header>
                <nav class="siva">
                    <a href="#name">Home</a>
                    <a href="#">About Us</a>
                    <a href="#">Skills</a>
                    <a href="#">Projects</a>
                    <a href="#">Resume</a>
                    <a href="#">Contact</a>
                </nav>
            </header>
        </div>
        <!-- name -->
        <section>
            <div id="name" class="name">
                <h1 class="mm">Hi, I am SIVARAMAN</h1><br>
                <h2>Software Developer</h2><br>
                <p>I am interested in Web Development, Python Programming and Software Development.

                </p>
            </div>
        </section>
        <!-- about us  -->
        <section>
            <div class="about">
                <h1>About</h1>

            </div>
        </section>
    </div>
</body>

</html>
